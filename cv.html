<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV · Arda Kılıç</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f7f8,#101317);--ink:light-dark(#14171c,#e9ecf0);--mute:light-dark(#596270,#9aa4b1);--line:light-dark(#d9dee4,#262d36);--acc:#ff5a1f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:900px;margin:0 auto;padding:10px max(4vw,16px);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{color:var(--mute);text-decoration:none;font-weight:600;padding:10px 0;margin-right:auto}
.back:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:6px;font-weight:600;text-decoration:none;background:var(--acc);color:#fff}
.btn:focus-visible,.back:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{max-width:900px;margin:0 auto;padding:24px max(4vw,16px) 48px}
h1{font-family:Archivo,Inter,sans-serif;font-weight:800;font-size:32px;margin:0 0 20px}
.page{display:block;width:100%;height:auto;background:#fff;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.15);margin-bottom:20px}
</style>
</head>
<body>
<header><div class="bar">
  <a class="back" href="./">← Arda Kılıç</a>
  <a class="btn" id="dl" href="Arda_Kilic_CV.pdf" download="Arda_Kilic_CV.pdf"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3a1 1 0 0 1 1 1v9.59l3.3-3.3a1 1 0 1 1 1.4 1.42l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 1 1 1.4-1.42l3.3 3.3V4a1 1 0 0 1 1-1zM5 19h14a1 1 0 1 1 0 2H5a1 1 0 1 1 0-2z"/></svg>Download PDF</a>
</div></header>
<main>
  <h1>CV</h1>
  <img class="page" src="img/cv/p-1.jpg" alt="CV page 1">
  <img class="page" src="img/cv/p-2.jpg" alt="CV page 2" loading="lazy">
</main>
<script>
{
const b=document.getElementById('dl');
b.addEventListener('click',async e=>{
  e.preventDefault();
  try{
    const r=await fetch(b.getAttribute('href'),{cache:'no-store'});
    if(!r.ok)throw 0;
    const blob=new Blob([await r.arrayBuffer()],{type:'application/octet-stream'});
    const u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download='Arda_Kilic_CV.pdf';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
  }catch(_){location.href=b.getAttribute('href')}
});
}
</script>
</body>
</html>
